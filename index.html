<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be Video</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .icon-transition {
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body style="background-color: #0b0f19; color: #ffffff; font-family: sans-serif; text-align: center; padding: 40px 20px; margin: 0;">

    <h1 style="color: #ff3333; font-size: 20px; margin-bottom: 5px;">VIDIO SEGAR HARIAN</h1>
    <p style="color: #a0aec0; font-size: 14px; margin-top: 0;">"enjoy your watch" 🎧</p>

    <hr style="border: 1px solid #2d3748; width: 60%; margin: 20px auto;">

    <div style="position: relative; display: inline-block; width: 100%; max-width: 500px; margin-top: 20px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); background-color: #000000;">
        
        <video id="myVideo" width="100%" loop muted playsinline style="display: block; pointer-events: none; background: #000000;">
            <source src="VID_20260321_172646.mp4" type="video/mp4">
            Browsermu spek ceker bawal, babi!
        </video>

        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.6); width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none; border: 2px solid rgba(255,255,255,0.7); z-index: 10;">
            <i id="ctrlIcon" class="fas fa-play icon-transition" style="color: #ffffff; font-size: 24px; margin-left: 4px;"></i>
        </div>

        <div style="position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; pointer-events: none; font-size: 14px; z-index: 10;">
            <i class="fas fa-volume-xmark" style="color: #ffffff;"></i>
        </div>

        <div style="position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.5); padding: 5px 8px; border-radius: 5px; pointer-events: none; font-size: 14px; z-index: 10;">
            <i class="fas fa-expand" style="color: #ffffff;"></i>
        </div>

        <a href="https://omg10.com/4/10522559" target="_blank" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; cursor: pointer; background: rgba(0,0,0,0.01);">
        </a>

    </div>

    <p style="margin-top: 25px; font-size: 13px; color: #4a5568;">🔥🔥</p>

    <script>
        window.addEventListener('load', function() {
            var video = document.getElementById('myVideo');
            var icon = document.getElementById('ctrlIcon');

            // TIMING 1: Begitu situs masuk, tunggu 0.8 detik, terus logo berubah JADI LOADING MUTER!
            setTimeout(function() {
                icon.className = "fas fa-spinner fa-spin icon-transition";
                icon.style.marginLeft = "0px"; // Penyesuaian center ikon loading
                
                // TIMING 2: Pura-pura loading selama 1.2 detik, baru VIDEO JALAN & TOMBOL JADI PAUSE!
                setTimeout(function() {
                    video.play(); // Eksekusi video jalan riel otomatis!
                    icon.className = "fas fa-pause icon-transition";
                }, 1200); // Durasi loading ghaib-nya 1.2 detik, babi!

            }, 800); // Waktu diem pas pertama masuk web selama 0.8 detik!
        });
    </script>

</body>
</html>
